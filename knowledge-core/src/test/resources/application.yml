spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: jdbc:h2:mem:devcollab;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
  flyway:
    enabled: true

devcollab:
  code-metadata-cache:
    enabled: false
    capacity: 1024
  agent-delegation:
    service-token: devcollab-test-agent-service-token-at-least-32-bytes
    delegation-ttl: PT24H
    access-token-ttl: PT15M
  grpc:
    server:
      enabled: false
      port: 0
      max-inbound-message-size: 1048576
      graceful-shutdown-timeout: PT1S
  cache:
    invalidation:
      enabled: false
      group-id: devcollab-cache-test
  search:
    engine: postgres
    elasticsearch:
      enabled: false
      url: http://localhost:9200
      index-name: devcollab-search-test
  outbox:
    kafka:
      document-topic: devcollab.document.events
      cache-topic: devcollab.cache.events
      review-topic: devcollab.review.events
      notification-topic: devcollab.notification.events
  worker:
    outbox:
      enabled: false
      batch-size: 50
      max-retry-count: 3
      fixed-delay-ms: 5000
      initial-delay-ms: 5000
  security:
    jwt:
      issuer: devcollab-test
      audience: devcollab-test-web
      secret: devcollab-test-secret-must-be-at-least-32-bytes
      access-token-ttl: PT30M
    refresh:
      ttl: P7D
      refresh-cookie-name: dc_refresh
      csrf-cookie-name: dc_csrf
      csrf-header-name: X-CSRF-Token
      allowed-origins:
        - http://localhost:5173
        - http://127.0.0.1:5173
      secure: false
