spring:
  application:
    name: devcollab-knowledge-core
  datasource:
    url: ${DEVCOLLAB_DB_URL:jdbc:postgresql://localhost:5432/devcollab}
    username: ${DEVCOLLAB_DB_USERNAME:devcollab}
    password: ${DEVCOLLAB_DB_PASSWORD:devcollab}
  flyway:
    enabled: true
  data:
    redis:
      host: ${DEVCOLLAB_REDIS_HOST:localhost}
      port: ${DEVCOLLAB_REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${DEVCOLLAB_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

devcollab:
  agent-delegation:
    service-token: ${DEVCOLLAB_AGENT_INTERNAL_TOKEN:devcollab-local-agent-service-token-change-me}
    delegation-ttl: ${DEVCOLLAB_AGENT_DELEGATION_TTL:PT24H}
    access-token-ttl: ${DEVCOLLAB_AGENT_ACCESS_TOKEN_TTL:PT15M}
  grpc:
    server:
      enabled: ${DEVCOLLAB_GRPC_ENABLED:true}
      port: ${DEVCOLLAB_GRPC_PORT:9090}
      max-inbound-message-size: ${DEVCOLLAB_GRPC_MAX_INBOUND_MESSAGE_SIZE:1048576}
      graceful-shutdown-timeout: ${DEVCOLLAB_GRPC_GRACEFUL_SHUTDOWN_TIMEOUT:PT5S}
  redis:
    coordination:
      login-limit:
        max-attempts: ${DEVCOLLAB_LOGIN_LIMIT_MAX_ATTEMPTS:5}
        window: ${DEVCOLLAB_LOGIN_LIMIT_WINDOW:PT15M}
      rate-limit:
        max-operations: ${DEVCOLLAB_RATE_LIMIT_MAX_OPERATIONS:120}
        window: ${DEVCOLLAB_RATE_LIMIT_WINDOW:PT1M}
  cache:
    enabled: ${DEVCOLLAB_CACHE_ENABLED:true}
    workspace-member-ttl: ${DEVCOLLAB_CACHE_WORKSPACE_MEMBER_TTL:PT10M}
    document-tree-ttl: ${DEVCOLLAB_CACHE_DOCUMENT_TREE_TTL:PT5M}
    published-document-ttl: ${DEVCOLLAB_CACHE_PUBLISHED_DOCUMENT_TTL:PT30M}
    approved-adr-ttl: ${DEVCOLLAB_CACHE_APPROVED_ADR_TTL:PT1H}
    local:
      enabled: ${DEVCOLLAB_LOCAL_CACHE_ENABLED:true}
      workspace-member-ttl: ${DEVCOLLAB_LOCAL_CACHE_WORKSPACE_MEMBER_TTL:PT2M}
      document-tree-ttl: ${DEVCOLLAB_LOCAL_CACHE_DOCUMENT_TREE_TTL:PT1M}
      workspace-member-maximum-size: ${DEVCOLLAB_LOCAL_CACHE_WORKSPACE_MEMBER_MAX_SIZE:10000}
      document-tree-maximum-size: ${DEVCOLLAB_LOCAL_CACHE_DOCUMENT_TREE_MAX_SIZE:1000}
      published-document-ttl: ${DEVCOLLAB_LOCAL_CACHE_PUBLISHED_DOCUMENT_TTL:PT10M}
      approved-adr-ttl: ${DEVCOLLAB_LOCAL_CACHE_APPROVED_ADR_TTL:PT30M}
      published-document-maximum-weight: ${DEVCOLLAB_LOCAL_CACHE_PUBLISHED_DOCUMENT_MAX_WEIGHT:50000000}
      approved-adr-maximum-weight: ${DEVCOLLAB_LOCAL_CACHE_APPROVED_ADR_MAX_WEIGHT:20000000}
    invalidation:
      enabled: ${DEVCOLLAB_CACHE_INVALIDATION_ENABLED:true}
      group-id: ${DEVCOLLAB_CACHE_INVALIDATION_GROUP_ID:${spring.application.name}-${random.uuid}}
  search:
    elasticsearch:
      enabled: ${DEVCOLLAB_ELASTICSEARCH_ENABLED:false}
      url: ${DEVCOLLAB_ELASTICSEARCH_URL:http://localhost:9200}
      index-name: ${DEVCOLLAB_ELASTICSEARCH_INDEX:devcollab-search}
  outbox:
    kafka:
      document-topic: ${DEVCOLLAB_KAFKA_DOCUMENT_TOPIC:devcollab.document.events}
      cache-topic: ${DEVCOLLAB_KAFKA_CACHE_TOPIC:devcollab.cache.events}
      review-topic: ${DEVCOLLAB_KAFKA_REVIEW_TOPIC:devcollab.review.events}
      notification-topic: ${DEVCOLLAB_KAFKA_NOTIFICATION_TOPIC:devcollab.notification.events}
      git-topic: ${DEVCOLLAB_KAFKA_GIT_TOPIC:devcollab.git.events}
  worker:
    outbox:
      # 默认启用：outbox 事件（仓库同步/删除等）依赖它发布到 Kafka。
      # 若默认关闭，手动启动 knowledge-core 时忘记设置
      # DEVCOLLAB_OUTBOX_WORKER_ENABLED=true 会让所有事件卡 PENDING（同步黑洞）。
      # 测试配置显式关闭（测试不需要 Kafka 发布）。
      enabled: ${DEVCOLLAB_OUTBOX_WORKER_ENABLED:true}
      batch-size: ${DEVCOLLAB_OUTBOX_WORKER_BATCH_SIZE:500}
      max-retry-count: ${DEVCOLLAB_OUTBOX_WORKER_MAX_RETRY_COUNT:3}
      fixed-delay-ms: ${DEVCOLLAB_OUTBOX_WORKER_FIXED_DELAY_MS:1000}
      initial-delay-ms: ${DEVCOLLAB_OUTBOX_WORKER_INITIAL_DELAY_MS:5000}
  security:
    jwt:
      issuer: ${DEVCOLLAB_JWT_ISSUER:devcollab-knowledge-core}
      audience: ${DEVCOLLAB_JWT_AUDIENCE:devcollab-web}
      secret: ${DEVCOLLAB_JWT_SECRET:devcollab-local-dev-jwt-secret-8f3a2c9e7b1d4f6a}
      access-token-ttl: ${DEVCOLLAB_ACCESS_TOKEN_TTL:PT30M}
    refresh:
      ttl: ${DEVCOLLAB_REFRESH_TOKEN_TTL:P7D}
      refresh-cookie-name: ${DEVCOLLAB_REFRESH_COOKIE_NAME:dc_refresh}
      csrf-cookie-name: ${DEVCOLLAB_CSRF_COOKIE_NAME:dc_csrf}
      csrf-header-name: ${DEVCOLLAB_CSRF_HEADER_NAME:X-CSRF-Token}
      allowed-origins: ${DEVCOLLAB_WEB_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:8088,http://127.0.0.1:8088}
      secure: ${DEVCOLLAB_COOKIE_SECURE:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    enabled: ${DEVCOLLAB_TRACING_ENABLED:false}
    sampling:
      probability: ${DEVCOLLAB_TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${DEVCOLLAB_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  pattern:
    correlation: "[${spring.application.name:devcollab-knowledge-core},%X{traceId:-},%X{spanId:-}] "
