# resolve 让 upstream 走动态解析（依赖下方 resolver，需共享内存 zone），
# ipv6=off 强制 IPv4。否则 host.docker.internal 解析为 WSL IPv6 地址，
# 连接失败即 no live upstreams → 工作台 502 假死（非 OOM）。
upstream devcollab_core {
    zone devcollab_core 64k;
    server host.docker.internal:8080 resolve;
}

upstream devcollab_gateway {
    zone devcollab_gateway 64k;
    server host.docker.internal:8090 resolve;
}

# agent-service 是容器，重建后会换 IP；upstream 块只在 nginx 启动时
# 解析一次并缓存，之后 502。改用 resolver + 变量在每次请求时动态解析。
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;

    server_tokens off;
    charset utf-8;
    client_max_body_size 10m;

    root /usr/share/nginx/html;
    index index.html;

    location = /nginx-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass http://devcollab_core;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location /ws/ {
        proxy_pass http://devcollab_gateway;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_buffering off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /agent-api/ {
        # set 必须放在 rewrite break 之前（break 会终止 rewrite 模块，
        # 之后的 set 不执行）。$uri 经 rewrite 剥离 /agent-api/ 前缀，
        # 变量 proxy_pass 每次请求动态解析 DNS，避免 agent-service
        # 容器重建换 IP 后 nginx 缓存旧地址导致 502。
        set $agent_upstream http://agent-service:8092;
        rewrite ^/agent-api/(.*)$ /$1 break;
        proxy_pass $agent_upstream$uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location /assets/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
