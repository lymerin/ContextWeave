[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "devcollab-agent-service"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "langgraph>=0.4,<2",
  "mcp>=1.9,<2",
  "redis>=5.2,<7",
  "httpx>=0.28,<1",
  "asyncpg>=0.30,<1",
  "psutil>=6.1,<8",
  "jsonschema>=4,<5",
  # 0.26.0 binding 有 Node 生命周期回归（解析多文件后 Node.text 访问悬垂内存
  # → SIGSEGV 崩溃循环）。锁定 0.25.2：479 文件压力测试连续通过。
  "tree-sitter==0.25.2",
  "tree-sitter-java>=0.23,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<2",
  "ruff>=0.11,<1",
  "mypy>=1.15,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
