    <text x="88" y="559" fill="#a8b6ce" font-size="12">Symbol-level bindings</text>
    <circle cx="346" cy="554" r="4" fill="#b6a4ff"/>
    <text x="362" y="559" fill="#a8b6ce" font-size="12">Drift detection</text>
    <circle cx="574" cy="554" r="4" fill="#9bb9ff"/>
    <text x="590" y="559" fill="#a8b6ce" font-size="12">Evidence-backed updates</text>
    <text x="1216" y="559" text-anchor="end" fill="#7688a7" font-size="11" letter-spacing="1.5">PRODUCT CONCEPT</text>
  </g>
</svg>
