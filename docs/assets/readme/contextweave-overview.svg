    <text x="502" y="402" fill="#a9b3cd" font-size="11">Validate input, persist, return the order.</text>
    <rect x="494" y="439" width="154" height="25" rx="12" fill="#312d4a"/>
    <text x="571" y="456" text-anchor="middle" fill="#c0b0fa" font-size="10" font-weight="600" letter-spacing=".5">LINKED DOCUMENT BLOCK</text>
    <text x="900" y="313" fill="#d8e2f5" font-size="15" font-weight="600">A reviewable change</text>
    <text x="900" y="337" fill="#8b9dbb" font-size="11">Agent proposal / code evidence / approval</text>
    <rect x="892" y="354" width="308" height="66" rx="8" fill="#272d49" stroke="#586c9d"/>
    <path d="M908 373L912 377L920 369M908 399L912 403L920 395" stroke="#8faeff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
