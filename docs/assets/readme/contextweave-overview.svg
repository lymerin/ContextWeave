    <text x="931" y="404" fill="#a9b3cd" font-size="11">Trace the supporting code evidence</text>
    <rect x="900" y="439" width="145" height="25" rx="12" fill="#2b324e"/>
    <text x="972" y="456" text-anchor="middle" fill="#a9c1ff" font-size="10" font-weight="600" letter-spacing=".5">AWAITING APPROVAL</text>
    <path d="M388 387H486M794 387H892" stroke="url(#link)" stroke-width="2"/>
    <circle cx="437" cy="387" r="16" fill="#172b36" stroke="#63d3c1" stroke-width="1.5"/>
    <path d="M430 387H444M430 387L434 383M430 387L434 391M444 387L440 383M444 387L440 391" stroke="#83e3d2" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="843" cy="387" r="16" fill="#27263f" stroke="#a08cdb" stroke-width="1.5"/>
    <path d="M837 387H849M849 387L844 382M849 387L844 392" stroke="#c0adf7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
