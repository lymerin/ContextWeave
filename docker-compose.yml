name: devcollab

services:
  postgres:
    image: postgres:17-alpine
    container_name: devcollab-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-devcollab}
      POSTGRES_USER: ${POSTGRES_USER:-devcollab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devcollab}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - devcollab-local

  redis:
    image: redis:8-alpine
    container_name: devcollab-redis
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - devcollab-local

  kafka:
    image: apache/kafka:4.0.0
    container_name: devcollab-kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports:
      - "9092:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1
      interval: 15s
      timeout: 10s
      retries: 10
    networks:
      - devcollab-local

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.3
    container_name: devcollab-elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: ${ELASTICSEARCH_JAVA_OPTS:--Xms512m -Xmx512m}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${ELASTICSEARCH_HOST_PORT:-9200}:9200"
      - "${ELASTICSEARCH_TRANSPORT_HOST_PORT:-9300}:9300"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS http://localhost:9200/_cluster/health || exit 1
      interval: 15s
      timeout: 10s
      retries: 10
    networks:
      - devcollab-local

  minio:
    image: minio/minio:${MINIO_VERSION:-RELEASE.2025-09-07T16-13-09Z}
    container_name: devcollab-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-devcollab}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-devcollab-minio-password}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${MINIO_API_HOST_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_HOST_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS http://localhost:9000/minio/health/live || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - devcollab-local

  agent-migrate:
    build:
      context: ./agent-service
    container_name: devcollab-agent-migrate
    restart: "no"
    env_file:
      - path: ./agent-service/.env
        required: false
    environment:
      AGENT_DATABASE_URL: ${AGENT_DATABASE_URL:-postgresql://devcollab:devcollab@postgres:5432/devcollab}
    command: ["python", "-m", "app.persistence.migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - devcollab-local

  agent-service:
    build:
      context: ./agent-service
    container_name: devcollab-agent-service
    restart: unless-stopped
    env_file:
      - path: ./agent-service/.env
        required: false
    environment:
      MCP_BASE_URL: ${AGENT_MCP_BASE_URL:-http://host.docker.internal:8091/mcp}
      REDIS_URL: ${AGENT_REDIS_URL:-redis://redis:6379/0}
      AGENT_DATABASE_URL: ${AGENT_DATABASE_URL:-postgresql://devcollab:devcollab@postgres:5432/devcollab}
      KNOWLEDGE_CORE_BASE_URL: ${AGENT_CORE_BASE_URL:-http://host.docker.internal:8080}
      AGENT_INTERNAL_SERVICE_TOKEN: ${DEVCOLLAB_AGENT_INTERNAL_TOKEN:-devcollab-local-agent-service-token-change-me}
      AGENT_PROJECT_UNIT_CONCURRENCY: ${AGENT_PROJECT_UNIT_CONCURRENCY:-2}
      AGENT_PLAN_BATCH_CONCURRENCY: ${AGENT_PLAN_BATCH_CONCURRENCY:-2}
      AGENT_HIGH_CONCURRENCY_ROLLOUT_PERCENT: ${AGENT_HIGH_CONCURRENCY_ROLLOUT_PERCENT:-0}
      AGENT_HIGH_CONCURRENCY_PROJECT_UNIT_CONCURRENCY: ${AGENT_HIGH_CONCURRENCY_PROJECT_UNIT_CONCURRENCY:-6}
      AGENT_HIGH_CONCURRENCY_PLAN_BATCH_CONCURRENCY: ${AGENT_HIGH_CONCURRENCY_PLAN_BATCH_CONCURRENCY:-4}
      AGENT_PROJECT_EXECUTION_LIMIT: ${AGENT_PROJECT_EXECUTION_LIMIT:-0}
      AGENT_PROJECT_MAX_TOOL_CALLS: ${AGENT_PROJECT_MAX_TOOL_CALLS:-24}
      DEVCOLLAB_MEMORY_PROFILE_ENABLED: ${DEVCOLLAB_MEMORY_PROFILE_ENABLED:-false}
      DEVCOLLAB_MEMORY_PROFILE_RUN_ID: ${DEVCOLLAB_MEMORY_PROFILE_RUN_ID:-}
      DEVCOLLAB_MEMORY_PROFILE_OUTPUT_DIR: /app/.data/memory-profile
      DEVCOLLAB_MEMORY_PROFILE_INTERVAL_MS: ${DEVCOLLAB_MEMORY_PROFILE_INTERVAL_MS:-1000}
    volumes:
      - ./.data:/app/.data
    expose:
      - "8092"
    depends_on:
      redis:
        condition: service_healthy
      agent-migrate:
        condition: service_completed_successfully
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8092/health')"
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - devcollab-local

  agent-worker:
    build:
      context: ./agent-service
    container_name: devcollab-agent-worker
    restart: unless-stopped
    env_file:
      - path: ./agent-service/.env
        required: false
    environment:
      MCP_BASE_URL: ${AGENT_MCP_BASE_URL:-http://host.docker.internal:8091/mcp}
      REDIS_URL: ${AGENT_REDIS_URL:-redis://redis:6379/0}
      AGENT_DATABASE_URL: ${AGENT_DATABASE_URL:-postgresql://devcollab:devcollab@postgres:5432/devcollab}
      KNOWLEDGE_CORE_BASE_URL: ${AGENT_CORE_BASE_URL:-http://host.docker.internal:8080}
      AGENT_INTERNAL_SERVICE_TOKEN: ${DEVCOLLAB_AGENT_INTERNAL_TOKEN:-devcollab-local-agent-service-token-change-me}
      AGENT_PROJECT_UNIT_CONCURRENCY: ${AGENT_PROJECT_UNIT_CONCURRENCY:-2}
      AGENT_PLAN_BATCH_CONCURRENCY: ${AGENT_PLAN_BATCH_CONCURRENCY:-2}
      AGENT_HIGH_CONCURRENCY_ROLLOUT_PERCENT: ${AGENT_HIGH_CONCURRENCY_ROLLOUT_PERCENT:-0}
      AGENT_HIGH_CONCURRENCY_PROJECT_UNIT_CONCURRENCY: ${AGENT_HIGH_CONCURRENCY_PROJECT_UNIT_CONCURRENCY:-6}
      AGENT_HIGH_CONCURRENCY_PLAN_BATCH_CONCURRENCY: ${AGENT_HIGH_CONCURRENCY_PLAN_BATCH_CONCURRENCY:-4}
      AGENT_PROJECT_EXECUTION_LIMIT: ${AGENT_PROJECT_EXECUTION_LIMIT:-0}
      AGENT_PROJECT_MAX_TOOL_CALLS: ${AGENT_PROJECT_MAX_TOOL_CALLS:-24}
      DEVCOLLAB_MEMORY_PROFILE_ENABLED: ${DEVCOLLAB_MEMORY_PROFILE_ENABLED:-false}
      DEVCOLLAB_MEMORY_PROFILE_RUN_ID: ${DEVCOLLAB_MEMORY_PROFILE_RUN_ID:-}
      DEVCOLLAB_MEMORY_PROFILE_OUTPUT_DIR: /app/.data/memory-profile
      DEVCOLLAB_MEMORY_PROFILE_INTERVAL_MS: ${DEVCOLLAB_MEMORY_PROFILE_INTERVAL_MS:-1000}
      # SIGSEGV/崩溃时输出 Python 栈，便于定位 C 扩展段错误
      PYTHONFAULTHANDLER: "1"
    volumes:
      - ./.data:/app/.data
    command: ["python", "-m", "app.worker"]
    depends_on:
      agent-migrate:
        condition: service_completed_successfully
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-m", "app.worker_health"]
      interval: 15s
      timeout: 6s
      retries: 8
    networks:
      - devcollab-local

  nginx:
    image: nginx:1.27-alpine
    container_name: devcollab-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_HOST_PORT:-8088}:80"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./web/dist:/usr/share/nginx/html:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        - CMD-SHELL
        - wget --spider -q http://127.0.0.1/nginx-health || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - devcollab-local

  prometheus:
    image: prom/prometheus:${PROMETHEUS_VERSION:-v3.5.0}
    container_name: devcollab-prometheus
    restart: unless-stopped
    profiles: ["observability"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=24h
      - --web.enable-lifecycle
    ports:
      - "${PROMETHEUS_HOST_PORT:-9091}:9090"
    volumes:
      - ./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/observability/prometheus-rules.yml:/etc/prometheus/rules.yml:ro
      - prometheus-data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - devcollab-local

  loki:
    image: grafana/loki:${LOKI_VERSION:-3.5.1}
    container_name: devcollab-loki
    restart: unless-stopped
    profiles: ["observability"]
    command: ["-config.file=/etc/loki/loki.yml"]
    ports:
      - "${LOKI_HOST_PORT:-3100}:3100"
    volumes:
      - ./deploy/observability/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    networks:
      - devcollab-local

  tempo:
    image: grafana/tempo:${TEMPO_VERSION:-2.8.2}
    container_name: devcollab-tempo
    restart: unless-stopped
    profiles: ["observability"]
    command: ["-config.file=/etc/tempo/tempo.yml"]
    ports:
      - "${TEMPO_HOST_PORT:-3200}:3200"
    volumes:
      - ./deploy/observability/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo-data:/var/tempo
    networks:
      - devcollab-local

  otel-collector:
    image: otel/opentelemetry-collector-contrib:${OTEL_COLLECTOR_VERSION:-0.130.1}
    container_name: devcollab-otel-collector
    restart: unless-stopped
    profiles: ["observability"]
    command: ["--config=/etc/otelcol-contrib/config.yml"]
    ports:
      - "${OTEL_GRPC_HOST_PORT:-4317}:4317"
      - "${OTEL_HTTP_HOST_PORT:-4318}:4318"
      - "${OTEL_HEALTH_HOST_PORT:-13133}:13133"
    volumes:
      - ./deploy/observability/otel-collector.yml:/etc/otelcol-contrib/config.yml:ro
    depends_on:
      - tempo
    networks:
      - devcollab-local

  alloy:
    image: grafana/alloy:${ALLOY_VERSION:-v1.10.0}
    container_name: devcollab-alloy
    restart: unless-stopped
    profiles: ["observability"]
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    ports:
      - "${ALLOY_HOST_PORT:-12345}:12345"
    volumes:
      - ./deploy/observability/alloy.config:/etc/alloy/config.alloy:ro
      - ./logs/local-demo:/var/log/devcollab:ro
      - alloy-data:/var/lib/alloy/data
    depends_on:
      - loki
    networks:
      - devcollab-local

  grafana:
    image: grafana/grafana:${GRAFANA_VERSION:-12.1.0}
    container_name: devcollab-grafana
    restart: unless-stopped
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-devcollab}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "${GRAFANA_HOST_PORT:-3000}:3000"
    volumes:
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
      - tempo
    networks:
      - devcollab-local

volumes:
  postgres-data:
  redis-data:
  kafka-data:
  elasticsearch-data:
  minio-data:
  prometheus-data:
  loki-data:
  tempo-data:
  alloy-data:
  grafana-data:

networks:
  devcollab-local:
    name: devcollab-local
